repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
        exclude: ^(runs/|assessment/references/)
      - id: trailing-whitespace
        exclude: ^(runs/|assessment/references/)
      - id: detect-private-key
      - id: check-added-large-files
        args: [--maxkb=1500]
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        exclude: ^(tests/|assessment/calibration/pins\.json$)  # pins are git commit SHAs, not secrets
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: mypy
        language: python
        additional_dependencies: [mypy==2.4.1]
        types: [python]
        pass_filenames: false
