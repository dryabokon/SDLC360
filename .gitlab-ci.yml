# GitLab CI: the same gates as .github/workflows/ci.yml (lint, tests, release archive smoke scan).
# Shared runners are Linux only, so the Windows leg of the GitHub matrix runs only on GitHub.
stages: [lint, test, build, deploy]

default:
  image: python:3.12-slim
  interruptible: true
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends git unzip > /dev/null
    - pip install -q -r requirements-dev.txt

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  GIT_DEPTH: "0"   # the scanner reads history

cache:
  key: pip-$CI_JOB_IMAGE
  paths: [.cache/pip]

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

lint:
  stage: lint
  script:
    - ruff check .
    - ruff format --check .
    - mypy

test:
  stage: test
  image: python:${PY}-slim
  parallel:
    matrix:
      - PY: ["3.12", "3.13"]
  script:
    - git config --global user.email ci@example.com && git config --global user.name ci   # fixtures commit
    - pytest --cov --cov-report=term --cov-report=xml --cov-fail-under=70
  coverage: '/^TOTAL.*\s(\d+(?:\.\d+)?)%/'
  artifacts:
    reports:
      coverage_report: { coverage_format: cobertura, path: coverage.xml }

build:
  stage: build
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends git unzip > /dev/null
  script:
    - mkdir -p dist && git archive --format=zip --prefix=sdlc360/ -o dist/sdlc360.zip HEAD
    - T="$(mktemp -d)" && cd "$T" && unzip -q "$CI_PROJECT_DIR/dist/sdlc360.zip"
    - python sdlc360/sdlc.py scan "$CI_PROJECT_DIR" --no-history --name self --runs-dir "$T/runs"
    - test -f "$T"/runs/*_self/report.html
  artifacts:
    paths: [dist/sdlc360.zip]
    expire_in: 30 days

