name: ci

on:
  push:
    branches: [main]
    paths-ignore: ["*.md", "docs/**"]  # root docs only: assessment/*.md is tested
  pull_request:
    paths-ignore: ["*.md", "docs/**"]  # root docs only: assessment/*.md is tested
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy

  test:
    needs: lint
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest --cov --cov-report=term --cov-fail-under=70

  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - name: build release archive
        run: mkdir -p dist && git archive --format=zip --prefix=sdlc360/ -o dist/sdlc360.zip HEAD
      - name: smoke-scan this repository from the archive
        run: |
          cd "$RUNNER_TEMP" && unzip -q "$GITHUB_WORKSPACE/dist/sdlc360.zip"
          python sdlc360/sdlc.py scan "$GITHUB_WORKSPACE" --no-history --name self --runs-dir "$RUNNER_TEMP/runs"
          test -f "$RUNNER_TEMP"/runs/*_self/report.html
