name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: build release archive
        env:
          TAG: ${{ github.ref_name }}
        run: mkdir -p dist && git archive --format=zip --prefix="sdlc360-$TAG/" -o "dist/sdlc360-$TAG.zip" HEAD
      - name: publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --title "$TAG" --notes-file CHANGELOG.md
